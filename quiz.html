<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Präteritum Übungsquiz – 4. Klasse</title>
  <style>
    :root {
      --primary: #4a90d9;
      --success: #27ae60;
      --error: #e74c3c;
      --neutral: #f0f4f8;
      --text: #2c3e50;
      --card-bg: #ffffff;
      --border: #d0dce8;
      --radius: 16px;
      --shadow: 0 4px 16px rgba(0,0,0,0.10);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #e8f4fd 0%, #fef9f0 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
    }
    header {
      text-align: center;
      padding: 20px 0 8px;
    }
    header h1 {
      font-size: 1.9rem;
      font-weight: 800;
      color: var(--primary);
    }
    header p {
      font-size: 1rem;
      color: #7f8c8d;
      margin-top: 4px;
    }

    /* Progress bar */
    .progress-wrap {
      max-width: 640px;
      margin: 20px auto 0;
      background: var(--border);
      border-radius: 99px;
      height: 10px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: var(--primary);
      border-radius: 99px;
      transition: width 0.4s ease;
      width: 0%;
    }
    .progress-label {
      text-align: center;
      font-size: 0.85rem;
      color: #7f8c8d;
      margin-top: 6px;
    }

    /* Quiz container */
    #quiz-container {
      max-width: 640px;
      margin: 24px auto 0;
    }

    /* Section heading */
    .section-badge {
      display: inline-block;
      background: var(--primary);
      color: white;
      border-radius: 99px;
      padding: 4px 16px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    /* Question card */
    .question-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      margin-bottom: 20px;
      border: 2px solid transparent;
      transition: border-color 0.3s;
    }
    .question-card.answered-correct { border-color: var(--success); }
    .question-card.answered-wrong   { border-color: var(--error); }

    .question-text {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 18px;
      line-height: 1.5;
    }
    .question-text .blank {
      display: inline-block;
      border-bottom: 3px solid var(--primary);
      min-width: 100px;
      margin: 0 4px;
    }

    /* Options grid */
    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .options.single-col {
      grid-template-columns: 1fr;
    }
    .option-btn {
      background: var(--neutral);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 1.05rem;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      min-height: 54px;
      display: flex;
      align-items: center;
      gap: 8px;
      -webkit-user-select: none;
      user-select: none;
    }
    .option-btn:active { transform: scale(0.97); }
    .option-btn.selected { background: #cde3fa; border-color: var(--primary); }
    .option-btn.correct  { background: #d4f8e8; border-color: var(--success); color: #1a7a44; font-weight: 700; }
    .option-btn.wrong    { background: #fde8e8; border-color: var(--error);   color: #c0392b; }

    /* Feedback */
    .feedback {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      display: none;
    }
    .feedback.show { display: block; }
    .feedback.correct-fb { background: #d4f8e8; color: #1a7a44; }
    .feedback.wrong-fb   { background: #fde8e8; color: #c0392b; }

    /* Confirm button */
    .confirm-btn {
      margin-top: 16px;
      width: 100%;
      padding: 15px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .confirm-btn:active { transform: scale(0.98); }
    .confirm-btn:disabled { background: #bdc3c7; cursor: default; }
    .confirm-btn.hide { display: none; }

    /* Drag-and-drop word bank */
    .word-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }
    .word-chip {
      background: var(--primary);
      color: white;
      border-radius: 99px;
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s, transform 0.1s;
      -webkit-user-select: none;
      user-select: none;
    }
    .word-chip:active  { transform: scale(0.95); }
    .word-chip.used    { opacity: 0.3; pointer-events: none; }

    .fill-sentence {
      font-size: 1.05rem;
      line-height: 2.2;
      margin-bottom: 10px;
    }
    .fill-slot {
      display: inline-block;
      min-width: 140px;
      border-bottom: 3px solid var(--primary);
      margin: 0 4px;
      padding: 0 6px;
      color: var(--primary);
      font-weight: 700;
      cursor: pointer;
      vertical-align: bottom;
      transition: background 0.15s;
      border-radius: 4px 4px 0 0;
    }
    .fill-slot.filled { background: #e8f4fd; }
    .fill-slot.correct-slot { background: #d4f8e8; color: #1a7a44; border-color: var(--success); }
    .fill-slot.wrong-slot   { background: #fde8e8; color: #c0392b; border-color: var(--error); }

    /* Score screen */
    #score-screen {
      display: none;
      max-width: 640px;
      margin: 40px auto;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 40px 32px;
      text-align: center;
    }
    #score-screen h2 { font-size: 2rem; color: var(--primary); margin-bottom: 12px; }
    .score-number {
      font-size: 4rem;
      font-weight: 900;
      color: var(--success);
      margin: 16px 0;
    }
    .score-msg { font-size: 1.15rem; color: #7f8c8d; margin-bottom: 28px; }
    .restart-btn {
      padding: 16px 40px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
    }

    @media (max-width: 400px) {
      .options { grid-template-columns: 1fr; }
      .question-text { font-size: 1.05rem; }
    }
  </style>
</head>
<body>

<header>
  <h1>📝 Präteritum Quiz</h1>
  <p>4. Klasse · Die Bronze-Prüfung (2)</p>
</header>

<div class="progress-wrap" id="progress-wrap" style="max-width:640px;margin:20px auto 0;">
  <div class="progress-bar" id="progress-bar"></div>
</div>
<div class="progress-label" id="progress-label">Frage 1 von 18</div>

<div id="quiz-container"></div>
<div id="score-screen">
  <h2>Super gemacht! 🎉</h2>
  <div class="score-number" id="final-score"></div>
  <div class="score-msg" id="score-msg"></div>
  <button class="restart-btn" onclick="startQuiz()">Nochmal üben 🔄</button>
</div>

<script>
// ─── Quiz data ───────────────────────────────────────────────────────────────

const questions = [
  // ── Aufgabe 6 – Präteritum bilden ─────────────────────────────────────────
  {
    section: "Aufgabe 6 – Präteritum bilden",
    type: "mc",
    text: "geben → ich ___",
    options: ["gab", "gebe", "gegeben", "gibt"],
    correct: 0
  },
  {
    section: "Aufgabe 6 – Präteritum bilden",
    type: "mc",
    text: "gehen → du ___",
    options: ["gingst", "gehst", "geht", "gegangen"],
    correct: 0
  },
  {
    section: "Aufgabe 6 – Präteritum bilden",
    type: "mc",
    text: "gewinnen → ihr ___",
    options: ["gewannt", "gewinnt", "gewinnen", "gewonnen"],
    correct: 0
  },
  {
    section: "Aufgabe 6 – Präteritum bilden",
    type: "mc",
    text: "vorlesen → er ___",
    options: ["las vor", "liest vor", "gelesen", "vorliest"],
    correct: 0
  },
  {
    section: "Aufgabe 6 – Präteritum bilden",
    type: "mc",
    text: "aufschreiben → ihr ___",
    options: ["schriebt auf", "schreibt auf", "aufschrieben", "schrieben auf"],
    correct: 0
  },
  {
    section: "Aufgabe 6 – Präteritum bilden",
    type: "mc",
    text: "nachrechnen → du ___",
    options: ["rechnetest nach", "rechnest nach", "nachgerechnet", "rechnen nach"],
    correct: 0
  },

  // ── Aufgabe 7 – Tabelle: denken ──────────────────────────────────────────
  {
    section: "Aufgabe 7 – Tabelle: denken",
    type: "mc",
    text: "denken → ich ___",
    options: ["dachte", "denkte", "denke", "gedachte"],
    correct: 0
  },
  {
    section: "Aufgabe 7 – Tabelle: denken",
    type: "mc",
    text: "denken → du ___",
    options: ["dachtest", "dachst", "denktest", "denkst"],
    correct: 0
  },
  {
    section: "Aufgabe 7 – Tabelle: denken",
    type: "mc",
    text: "denken → er / sie / es ___",
    options: ["dachte", "denkete", "hat gedacht", "denkt"],
    correct: 0
  },
  {
    section: "Aufgabe 7 – Tabelle: denken",
    type: "mc",
    text: "denken → wir ___",
    options: ["dachten", "denkten", "denken", "dachtest"],
    correct: 0
  },
  {
    section: "Aufgabe 7 – Tabelle: denken",
    type: "mc",
    text: "denken → ihr ___",
    options: ["dachtet", "dachten", "dachte", "denket"],
    correct: 0
  },

  // ── Aufgabe 7 – Tabelle: haben ───────────────────────────────────────────
  {
    section: "Aufgabe 7 – Tabelle: haben",
    type: "mc",
    text: "haben → ich ___",
    options: ["hatte", "habe", "gehabt", "habte"],
    correct: 0
  },
  {
    section: "Aufgabe 7 – Tabelle: haben",
    type: "mc",
    text: "haben → du ___",
    options: ["hattest", "hattest du", "habtest", "hatst"],
    correct: 0
  },
  {
    section: "Aufgabe 7 – Tabelle: haben",
    type: "mc",
    text: "haben → wir ___",
    options: ["hatten", "habten", "habt", "haben"],
    correct: 0
  },

  // ── Aufgabe 8 – Sätze ins Präteritum ────────────────────────────────────
  {
    section: "Aufgabe 8 – Sätze ins Präteritum",
    type: "mc",
    singleCol: true,
    text: "Am Dienstag fährt unsere Klasse mit dem Bus zum Schwimmen.\n👉 Wähle den richtigen Satz im Präteritum:",
    options: [
      "Am Dienstag fuhr unsere Klasse mit dem Bus zum Schwimmen.",
      "Am Dienstag fahre unsere Klasse mit dem Bus zum Schwimmen.",
      "Am Dienstag ist unsere Klasse mit dem Bus zum Schwimmen gefahren.",
      "Am Dienstag fährt unsere Klasse mit dem Bus zum Schwimmen gewesen."
    ],
    correct: 0
  },
  {
    section: "Aufgabe 8 – Sätze ins Präteritum",
    type: "mc",
    singleCol: true,
    text: "Im Schwimmbad ziehen wir uns unsere Badesachen an.\n👉 Wähle den richtigen Satz im Präteritum:",
    options: [
      "Im Schwimmbad zogen wir uns unsere Badesachen an.",
      "Im Schwimmbad zieht wir uns unsere Badesachen an.",
      "Im Schwimmbad zogen uns unsere Badesachen an.",
      "Im Schwimmbad ziehten wir uns unsere Badesachen an."
    ],
    correct: 0
  },
  {
    section: "Aufgabe 8 – Sätze ins Präteritum",
    type: "mc",
    singleCol: true,
    text: "Der Schwimmunterricht macht uns sehr viel Spaß.\n👉 Wähle den richtigen Satz im Präteritum:",
    options: [
      "Der Schwimmunterricht machte uns sehr viel Spaß.",
      "Der Schwimmunterricht mächte uns sehr viel Spaß.",
      "Der Schwimmunterricht macht uns sehr viel Spaß gehabt.",
      "Der Schwimmunterricht hat uns sehr viel Spaß gemacht."
    ],
    correct: 0
  },

  // ── Aufgabe 9 – Lückentext ───────────────────────────────────────────────
  {
    section: "Aufgabe 9 – Was weißt du über das Präteritum?",
    type: "mc",
    text: "Wenn etwas bereits passiert ist, steht das Verb im ___.",
    options: ["Präteritum", "Präsens", "Futur", "Imperativ"],
    correct: 0
  },
  {
    section: "Aufgabe 9 – Was weißt du über das Präteritum?",
    type: "mc",
    text: "Dadurch wird deutlich, dass das Ereignis oder das Geschehen schon ___ ist.",
    options: ["vorbei", "passiert", "geschrieben", "begonnen"],
    correct: 0
  },
  {
    section: "Aufgabe 9 – Was weißt du über das Präteritum?",
    type: "mc",
    text: "Das Präteritum findet sich oft in ___.",
    options: ["Geschichten", "Gedichten", "Briefen", "Tabellen"],
    correct: 0
  },
  {
    section: "Aufgabe 9 – Was weißt du über das Präteritum?",
    type: "mc",
    text: "Das Präteritum wird auch ___ genannt.",
    options: ["1. Vergangenheit", "Perfekt", "Mitvergangenheit", "Vorvergangenheit"],
    correct: 0
  }
];

// ─── State ────────────────────────────────────────────────────────────────────
let current = 0;
let score = 0;
let answered = [];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Shuffle options but keep track of correct answer text
function prepareQuestion(q) {
  const correctText = q.options[q.correct];
  const shuffled = shuffle(q.options);
  return { ...q, shuffledOptions: shuffled, correctText };
}

let prepared = [];

function startQuiz() {
  current = 0;
  score = 0;
  answered = [];
  prepared = questions.map(prepareQuestion);

  document.getElementById('score-screen').style.display = 'none';
  document.getElementById('quiz-container').style.display = 'block';
  document.getElementById('progress-wrap').style.display = 'block';
  document.querySelector('.progress-label').style.display = 'block';
  renderQuestion();
}

function renderQuestion() {
  const total = prepared.length;
  const pct = (current / total) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-label').textContent = `Frage ${current + 1} von ${total}`;

  const container = document.getElementById('quiz-container');
  container.innerHTML = '';

  if (current >= total) {
    showScore();
    return;
  }

  const q = prepared[current];
  let prevSection = current > 0 ? prepared[current - 1].section : null;

  const card = document.createElement('div');
  card.className = 'question-card';

  // Section badge if new section
  if (q.section !== prevSection) {
    const badge = document.createElement('div');
    badge.className = 'section-badge';
    badge.textContent = q.section;
    card.appendChild(badge);
  }

  // Question text
  const qText = document.createElement('div');
  qText.className = 'question-text';
  qText.innerHTML = q.text.replace(/\n/g, '<br>');
  card.appendChild(qText);

  // Options
  const opts = document.createElement('div');
  opts.className = 'options' + (q.singleCol ? ' single-col' : '');
  card.appendChild(opts);

  let selectedBtn = null;
  let locked = false;

  q.shuffledOptions.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span>${opt}</span>`;
    btn.addEventListener('click', () => {
      if (locked) return;
      if (selectedBtn) selectedBtn.classList.remove('selected');
      btn.classList.add('selected');
      selectedBtn = btn;
      confirmBtn.disabled = false;
    });
    opts.appendChild(btn);
  });

  // Feedback
  const fb = document.createElement('div');
  fb.className = 'feedback';
  card.appendChild(fb);

  // Confirm button
  const confirmBtn = document.createElement('button');
  confirmBtn.className = 'confirm-btn';
  confirmBtn.textContent = 'Antwort bestätigen ✔️';
  confirmBtn.disabled = true;
  card.appendChild(confirmBtn);

  confirmBtn.addEventListener('click', () => {
    if (!selectedBtn || locked) return;
    locked = true;
    confirmBtn.classList.add('hide');

    const chosen = selectedBtn.querySelector('span').textContent;
    const isCorrect = chosen === q.correctText;

    if (isCorrect) {
      score++;
      selectedBtn.classList.remove('selected');
      selectedBtn.classList.add('correct');
      card.classList.add('answered-correct');
      fb.textContent = '✅ Richtig! Super gemacht!';
      fb.className = 'feedback show correct-fb';
    } else {
      selectedBtn.classList.remove('selected');
      selectedBtn.classList.add('wrong');
      card.classList.add('answered-wrong');
      fb.textContent = `❌ Leider falsch. Richtig wäre: „${q.correctText}"`;
      fb.className = 'feedback show wrong-fb';
      // Highlight correct
      opts.querySelectorAll('.option-btn').forEach(b => {
        if (b.querySelector('span').textContent === q.correctText) {
          b.classList.add('correct');
        }
      });
    }

    answered.push(isCorrect);

    // Next button
    const nextBtn = document.createElement('button');
    nextBtn.className = 'confirm-btn';
    const isLast = current === prepared.length - 1;
    nextBtn.textContent = isLast ? 'Ergebnis anzeigen 🏆' : 'Nächste Frage →';
    card.appendChild(nextBtn);
    nextBtn.addEventListener('click', () => {
      current++;
      renderQuestion();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });

  container.appendChild(card);
}

function showScore() {
  document.getElementById('quiz-container').style.display = 'none';
  document.getElementById('progress-wrap').style.display = 'none';
  document.querySelector('.progress-label').style.display = 'none';

  const total = prepared.length;
  const pct = Math.round((score / total) * 100);

  document.getElementById('final-score').textContent = `${score} / ${total}`;

  let msg = '';
  if (pct === 100) msg = '🌟 Perfekt! Du hast alles richtig! Fantastisch!';
  else if (pct >= 80) msg = '🎉 Sehr gut! Du hast das Präteritum gut verstanden!';
  else if (pct >= 60) msg = '👍 Gut! Ein bisschen mehr üben und du schaffst es!';
  else if (pct >= 40) msg = '💪 Weiter üben! Du schaffst das!';
  else msg = '📖 Schau dir nochmal dein Heft an und versuche es erneut!';

  document.getElementById('score-msg').textContent = msg;
  document.getElementById('score-screen').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ─── Start ────────────────────────────────────────────────────────────────────
startQuiz();
</script>
</body>
</html>
